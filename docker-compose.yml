services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitmanager
      POSTGRES_PASSWORD: fitmanager
      POSTGRES_DB: fitmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmanager"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
